id = "herdr-omni"
name = "Herdr Omni"
version = "0.6.0"
min_herdr_version = "0.7.0"
description = "Fuzzy search for Herdr actions, workspaces, tabs, worktrees, and agent sessions"
platforms = ["linux", "macos"]

[[build]]
command = ["bun", "install", "--production"]

[[panes]]
id = "picker"
title = "Herdr Omni"
placement = "popup"
width = "80%"
height = 20
command = ["bun", "run", "src/main.ts"]

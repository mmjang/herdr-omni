id = "herdr-omni"
name = "Herdr Omni"
version = "0.16.0"
min_herdr_version = "0.7.0"
description = "Fuzzy search for Herdr actions, workspaces, tabs, worktrees, and agent sessions"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[panes]]
id = "picker"
title = "Herdr Omni"
placement = "popup"
width = "90%"
height = "90%"
command = ["./bin/herdr-omni"]
